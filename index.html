<!doctype html>
<html lang="jp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla JS Calendar</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="calendar-app">
      <h1>Monthly Calendar</h1>

      <section class="controls" aria-label="Calendar controls">
        <button id="prevBtn" type="button">Prev</button>
        <input id="monthPicker" type="month" aria-label="Pick year and month" />
        <button id="nextBtn" type="button">Next</button>
        <button id="todayBtn" type="button">This Month</button>
      </section>

      <h2 id="monthTitle" class="month-title"></h2>

      <section class="calendar" aria-label="Monthly calendar">
        <table class="calendar-table">
          <thead>
            <tr>
              <th scope="col">Sun</th>
              <th scope="col">Mon</th>
              <th scope="col">Tue</th>
              <th scope="col">Wed</th>
              <th scope="col">Thu</th>
              <th scope="col">Fri</th>
              <th scope="col">Sat</th>
            </tr>
          </thead>
          <tbody id="days"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
